# Separate dedicated login host, never the backend or task-worker daemon.
# Firewall-reviewed egress network must exist BEFORE this service starts.
services:
  login-supervisor:
    image: ${LOMA_LOGIN_SUPERVISOR_IMAGE:?Pin the rebuilt supervisor image by digest}
    entrypoint: [python, -m, isolation.login_supervisor]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    ports:
      - "${LOMA_LOGIN_BIND_IP:?Private interface IP required}:8443:8443"
    environment:
      LOMA_WORKER_IMAGE: ${LOMA_LOGIN_IMAGE:?Digest-pinned login image required}
      LOMA_WORKER_CONTROL_TOKEN_FILE: /run/secrets/control-token
      LOMA_WORKER_TLS_CERT: /run/secrets/server-cert
      LOMA_WORKER_TLS_KEY: /run/secrets/server-key
      LOMA_WORKER_CLIENT_CA: /run/secrets/client-ca
      LOMA_WORKER_MAX_CONCURRENCY: 4
      LOMA_WORKER_MAX_SECONDS: 660
      LOMA_LOGIN_NETWORK: ${LOMA_LOGIN_NETWORK:?Reviewed dedicated bridge required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    secrets: [control-token, server-cert, server-key, client-ca]
secrets:
  control-token:
    file: ${LOMA_LOGIN_TOKEN_PATH:?Required}
  server-cert:
    file: ${LOMA_LOGIN_SERVER_CERT_PATH:?Required}
  server-key:
    file: ${LOMA_LOGIN_SERVER_KEY_PATH:?Required}
  client-ca:
    file: ${LOMA_LOGIN_CLIENT_CA_PATH:?Required}
