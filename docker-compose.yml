services:
  loma-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # Loopback only — reached externally through the nginx proxy, not directly.
    # Host port is env-driven so multiple stacks can coexist on one box (preview
    # deployments); unset → 3000, identical to a normal single-stack deploy.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - loma-login-socket:/run/loma-login:ro
      - loma-skill-assets:/var/lib/loma/skill-assets
      # Mount the real .env so the dashboard Environment admin (/api/env) can read & edit it.
      # env_file injects values into the process env, but does not place a file at /app/.env.
      - ./.env:/app/.env
      # Persist connected Claude Code accounts (CLAUDE_USERS_DIR) across container
      # recreation — otherwise `claude login` creds are lost on every rebuild/redeploy.
      - loma-claude-users:/opt/claude-users
      # Same persistence for connected Codex (ChatGPT subscription) accounts
      # (CODEX_USERS_DIR) — otherwise `codex login` creds are lost on every
      # rebuild/redeploy while Claude logins survive.
      - loma-codex-users:/opt/codex-users
      - loma-workspace:/opt/loma-workspace
      - ${LOMA_SECRETS_DIR:-/home/ubuntu/secrets}:/home/ubuntu/secrets:ro
      # Host SSH key dir (key authorized on 98.83.133.237), mounted read-only at a
      # side path so the container keeps a writable /root/.ssh for known_hosts.
      # Override LOMA_SSH_DIR if the key lives elsewhere on the host.
      - ${LOMA_SSH_DIR:-/home/ubuntu/.ssh}:/root/.ssh-host:ro
    # On SIGTERM the backend marks in-flight runs interrupted and notifies their
    # owners (recovery.mark_all_running_interrupted); give it time to finish
    # before Docker's SIGKILL (default grace is only 10s).
    depends_on:
      loma-login:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  # Included in the normal deployment. No published ports, secrets, Docker
  # socket or persistent credential mounts. Browser clients never reach it.
  loma-login:
    build:
      context: .
      dockerfile: deploy/worker/bundled-login.Dockerfile
      target: broker
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT, SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL, NET_ADMIN, MKNOD]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 300
    mem_limit: 2g
    cpus: 2
    volumes:
      - loma-login-socket:/run/loma-login
    tmpfs:
      - /sandbox/dev:rw,nosuid,dev,size=1m,mode=755
      - /sandbox/sessions:rw,nosuid,nodev,noexec,size=128m,mode=755
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    networks: [login-private]
    depends_on:
      loma-login-proxy:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/loma-login/login.sock'); s.sendall(b'GET /health HTTP/1.0\\r\\n\\r\\n'); assert b'200 OK' in s.recv(1024)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  loma-login-proxy:
    build:
      context: .
      dockerfile: deploy/worker/bundled-login.Dockerfile
      target: proxy
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [login-private, login-egress]
    restart: unless-stopped

  loma-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Login UI: "local" (default), "google", or "local,google". Build-time
        # (NEXT_PUBLIC_*); set NEXT_PUBLIC_AUTH_PROVIDER in the project .env and
        # rebuild. The runtime AUTH_PROVIDER lives in dashboard/.env.
        NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-local}
    env_file: ./dashboard/.env
    environment:
      BACKEND_URL: http://loma-backend:3000
    # Loopback only — reached externally through the nginx proxy, not directly.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3001}:3001"
    depends_on:
      - loma-backend
    restart: unless-stopped

  # MCP sidecar: exposes each user's task board to external agents over
  # Streamable HTTP at /mcp/tasks (bearer API keys minted in the dashboard).
  # Internal-only — reached exclusively through the nginx proxy.
  loma-tasks-mcp:
    build:
      context: ./mcp-servers/loma-tasks
      dockerfile: Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://loma-backend:3000
    depends_on:
      - loma-backend
    restart: unless-stopped

  # Single external entrypoint. Serves the dashboard on :80 and routes /api +
  # webhooks to the backend over the internal network, so :3000/:3001 need not
  # be exposed. For HTTPS on :443 see deploy/nginx/README.md.
  nginx:
    image: nginx:1.27-alpine
    # Defaults to publishing on all interfaces :80 (normal deploy). Preview stacks
    # bind a unique loopback port (e.g. 127.0.0.1:20002) and sit behind a shared
    # front proxy that routes pr-<N>.preview.<domain> to them.
    ports:
      - "${NGINX_HOST_BIND:-0.0.0.0}:${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certbot/www:/var/www/certbot:ro
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - loma-backend
      - loma-dashboard
      - loma-tasks-mcp
    restart: unless-stopped

  # Phase 2 (HTTPS): obtain/renew Let's Encrypt certs via the webroot challenge.
  # Disabled by default (only runs with `--profile certbot`). See deploy/nginx/README.md.
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./deploy/nginx/certbot/conf:/etc/letsencrypt
      - ./deploy/nginx/certbot/www:/var/www/certbot

networks:
  login-private:
    internal: true
    enable_ipv6: false
  login-egress:

volumes:
  loma-login-socket:
  loma-skill-assets:
  loma-claude-users:
  loma-codex-users:
  loma-workspace:
